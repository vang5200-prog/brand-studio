<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>短影音內容獲客工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d0b;--s1:#171510;--s2:#201d16;--s3:#2a261d;--line:#352f23;--tx:#f3ede1;--mu:#a69d8a;--gold:#d6a84c;--gold2:#ecc77a;--goldd:#2a2110;--red:#e0705a;--grn:#86b982;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.7 'Noto Sans TC',-apple-system,BlinkMacSystemFont,'PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif;overflow-wrap:anywhere}
body.noscroll{overflow:hidden}
a{color:var(--gold2)}
h1,h2,h3,h4{margin:0;line-height:1.4}
h2{font-size:22px}h3{font-size:19px}h4{font-size:17px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--mu)}
.small{font-size:14px}
.pre{white-space:pre-wrap;word-break:break-word}
.hide{display:none!important}

#app{min-height:100vh}
#sidebar{display:none}
#main{min-width:0}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(14,13,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#topbar h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-size:22px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.pill{max-width:46vw;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #5a4719;background:var(--goldd);color:var(--gold2);font:inherit;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#view{padding:16px 16px 120px;max-width:880px;margin:0 auto}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(23,21,16,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabbar a,#tabbar button{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--mu);font:inherit;font-size:12.5px;text-decoration:none;cursor:pointer}
#tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabbar .on{color:var(--gold)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.hi{background:var(--s2);border-top:2px solid var(--gold)}
.card h3{margin-bottom:6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .btn{flex:1 1 150px}
.sec-t{margin:22px 0 10px;font-size:18px}

.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.btn.gold{background:var(--gold);color:#1b1407;border-color:var(--gold);font-weight:700}
.btn.danger{color:var(--red)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

.fld{margin-bottom:14px}
.fld label{display:block;margin-bottom:6px;font-size:15px;color:var(--mu);font-weight:500}
.req{color:var(--gold);font-size:12px;margin-left:4px}
.inp{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;line-height:1.6;appearance:none;-webkit-appearance:none}
textarea.inp{min-height:110px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.inp:focus{border-color:var(--gold);outline:none}

.filters{margin-bottom:12px}
.frow{display:flex;gap:8px;margin-top:8px}
.frow .inp{flex:1;min-width:0}

.item h4{margin-bottom:6px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--mu)}
.badge.gold{color:var(--gold2);border-color:#5a4719}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .btn{flex:1 1 72px}
.empty{padding:28px 16px;text-align:center;color:var(--mu);border:1px dashed var(--line);border-radius:var(--r)}
.empty .btn{margin-top:12px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{display:block;padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);text-decoration:none;color:var(--tx)}
.stat b{display:block;font-size:30px;line-height:1.2;color:var(--gold)}
.stat span{font-size:14px;color:var(--mu)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick .btn{min-height:56px}
.meter{height:8px;border-radius:99px;background:var(--s3);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--gold)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold2);background:var(--goldd)}

.back{display:inline-block;margin-bottom:12px;padding:8px 0;text-decoration:none;color:var(--gold2)}
.savebar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:10px;padding:10px;background:rgba(14,13,11,.94);border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
.savebar .btn{flex:1}
.cand{border-top:1px solid var(--line);padding:10px 0}.cand summary{cursor:pointer;padding:4px 0}
.candtxt{white-space:pre-wrap;line-height:1.85;margin:8px 0;font-size:15px}
.candwarn{color:var(--gold);font-size:13px;margin:6px 0}
.autosv{align-self:center;font-size:12px;color:var(--muted);white-space:nowrap}

.chain{list-style:none;margin:0 0 4px;padding:0}
.chain li{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.chain li small{display:block;color:var(--mu);font-size:13px}
.chain li+li{margin-top:16px;position:relative}
.chain li+li::before{content:'';position:absolute;left:22px;top:-16px;height:16px;width:2px;background:var(--gold)}

#chatlog{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.bubble{max-width:92%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.bubble.q{align-self:flex-end;background:var(--goldd);border:1px solid #5a4719}
.bubble.a{align-self:flex-start;background:var(--s2);border:1px solid var(--line)}
.bubble small{display:block;margin-top:8px;color:var(--mu);font-size:13px}

#modal-root:not(.open){display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:20px 20px 0 0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1}
.sheet-b{padding:16px;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:10px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.sheet-f:empty{display:none}
.mlink{display:flex;align-items:center;min-height:50px;padding:0 12px;border-radius:10px;color:var(--tx);text-decoration:none}
.mlink.on{background:var(--goldd);color:var(--gold2)}
.mgroup{margin:12px 0 4px;font-size:14px;color:var(--mu)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.radio input{width:22px;height:22px;margin-top:3px;accent-color:#d6a84c}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:60;max-width:88vw;padding:12px 18px;border-radius:12px;background:#f3ede1;color:#1b1407;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:700px){
 .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:640px;max-height:86vh;border-radius:20px}
 .stats{grid-template-columns:repeat(4,1fr)}
 .quick{grid-template-columns:repeat(5,1fr)}
}
@media(min-width:900px){
 #app{display:grid;grid-template-columns:268px minmax(0,1fr)}
 #sidebar{display:block;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;background:var(--s1);border-right:1px solid var(--line)}
 #sidebar .brand{font-size:19px;font-weight:700;color:var(--gold2);padding:0 12px 10px}
 #tabbar,.menu-btn{display:none}
 #view{padding-bottom:60px}
 .savebar{bottom:12px}
 #toast{bottom:30px}
}
.btn,.chip,.icon-btn,.pill{transition:transform .08s ease,box-shadow .12s ease,background-color .12s}
.btn:active,.chip:active,.icon-btn:active,.pill:active{transform:scale(.96);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.btn.gold:active{background:var(--gold2);box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.btn.ghost{background:transparent;border-color:#5a4719;color:var(--gold2)}
.acts .btn.wide{flex:1 1 100%}
.item{scroll-margin-top:76px}
.card.flash{animation:flash 1.5s ease}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.kv{margin:0 0 8px}
.kv b{display:block;font-size:14px;font-weight:500;color:var(--gold2)}
.kv span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word;color:var(--mu)}
.meta{font-size:14px;color:var(--mu);margin:0 0 8px}
.full{margin:6px 0 0}
.full .sec{padding:12px 0;border-top:1px solid var(--line)}
.full dt{font-size:14px;font-weight:700;color:var(--gold2);margin:0 0 4px}
.full dd{margin:0;white-space:pre-wrap;word-break:break-word}
.chain li .v{white-space:pre-wrap}

.syncdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mu)}
.syncdot.ok{background:var(--grn)}
.syncdot.busy{background:var(--gold);animation:pulse 1s ease-in-out infinite}
.syncdot.warn{background:#e0a24a}
.syncdot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.stack .btn{display:flex;flex-direction:column;align-items:flex-start;width:100%;height:auto;min-height:56px;padding:12px 14px;margin-bottom:10px;text-align:left}
.stack .btn small{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <aside id="sidebar" aria-label="主選單"></aside>
 <div id="main">
  <header id="topbar">
   <button class="icon-btn menu-btn" data-act="menu" aria-label="開啟選單">☰</button>
   <h1 id="ptitle">首頁</h1>
   <span id="syncdot" class="syncdot hide" role="img" aria-label="雲端同步狀態"></span>
   <button class="pill" id="clientpill" data-act="pickClient" aria-label="切換業主"></button>
  </header>
  <main id="view"></main>
 </div>
</div>
<nav id="tabbar" aria-label="快速導覽"></nav>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">此工具需要啟用 JavaScript。</p></noscript>

<script>
(function(){
'use strict';

/* ============ 基本設定與工具 ============ */
const APP={V:1,K:{data:'bsw.data',set:'bsw.settings',bad:'bsw.data.unreadable',sync:'bsw.sync',prev:'bsw.data.prev'}};
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const iso=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const fdate=s=>{if(!s)return'';const d=new Date(s);if(isNaN(d))return String(s);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())};
const short=(s,n)=>{s=String(s==null?'':s).replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s};

let toastT;
function toast(m,ms){m=String(m);const good=/已|完成/.test(m)&&!/失敗|無法|不能|錯誤/.test(m);const t=$('#toast');t.textContent=(good?'✓ ':'')+m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2400)}

function copyText(t){
  t=String(t==null?'':t);
  function fb(){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,t.length)}catch(e){}let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?'已複製':'無法自動複製，請長按文字手動複製')}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('已複製'),fb)}else fb();
}
function setBusy(btn,on,label){if(!btn)return;if(on){btn.dataset.old=btn.textContent;btn.textContent=label||'處理中…';btn.disabled=true}else{btn.textContent=btn.dataset.old||btn.textContent;btn.disabled=false}}

/* ============ 資料層（localStorage + 版本） ============ */
const TOPIC_TYPES=['綜合推薦','人設型選題','獲客型選題','泛流量型選題'];
const TOPIC_STATUS=['待製作','製作中','已完成'];
const SCRIPT_STATUS=['草稿','已保存','已發佈'];
const ASSET_TYPES=['文案','腳本','靈感','素材','其他'];
const COLS=['stories','services','cases','topics','scripts','frameworks','teardowns','ctas','funnels','assets'];

/* 資料結構升級：key = 舊版本號，函式把資料升到下一版。未來改欄位時在這裡加 migration。 */
const MIGRATIONS={
  // 1:function(db){ /* v1 → v2 的轉換寫在這裡 */ }
};

function newClient(name){const c={id:uid(),name:name,createdAt:iso(),brand:{},persona:{},chats:[]};COLS.forEach(k=>c[k]=[]);return c}
function normClient(c){c=c||{};c.id=c.id||uid();c.name=c.name||'未命名業主';c.createdAt=c.createdAt||iso();c.brand=c.brand&&typeof c.brand==='object'?c.brand:{};c.persona=c.persona&&typeof c.persona==='object'?c.persona:{};COLS.concat(['chats']).forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});return c}
function migrate(db){
  db=db||{};db.dataVersion=Number(db.dataVersion)||1;
  while(db.dataVersion<APP.V){const fn=MIGRATIONS[db.dataVersion];if(fn)fn(db);db.dataVersion++}
  db.clients=(Array.isArray(db.clients)?db.clients:[]).map(normClient);
  if(!db.clients.some(c=>c.id===db.currentClientId))db.currentClientId=db.clients[0]?db.clients[0].id:null;
  return db;
}
function loadDB(){
  let raw=null;try{raw=localStorage.getItem(APP.K.data)}catch(e){}
  const fresh={dataVersion:APP.V,currentClientId:null,clients:[]};
  if(!raw)return fresh;
  try{return migrate(JSON.parse(raw))}catch(e){
    try{localStorage.setItem(APP.K.bad,raw)}catch(_){}
    setTimeout(()=>toast('舊資料無法讀取，已另存一份備份並建立新資料',4000),600);
    return fresh;
  }
}
let warnedStore=false;
function persist(){
  DB.dataVersion=APP.V;
  try{localStorage.setItem(APP.K.data,JSON.stringify(DB))}catch(e){if(!warnedStore){warnedStore=true;toast('儲存失敗：瀏覽器空間不足，或正在無痕模式。請先匯出備份',5000)}}
  syncAfterPersist();
}
function loadSettings(){try{const s=JSON.parse(localStorage.getItem(APP.K.set)||'{}');return{endpoint:s.endpoint||'',model:s.model||'',key:s.key||''}}catch(e){return{endpoint:'',model:'',key:''}}}
function saveSettings(){try{localStorage.setItem(APP.K.set,JSON.stringify(SET))}catch(e){toast('設定儲存失敗')}}

let DB=loadDB();
let SET=loadSettings();
let SYNC=loadSync();
const UI={f:{},sugg:[],topicType:TOPIC_TYPES[0],editTD:null,iv:null,confirmRes:null,exp:{}};
const VIEWS={};
const VIEWOPT={};
const cur=()=>DB.clients.find(c=>c.id===DB.currentClientId)||null;

/* ============ 欄位定義 ============ */
const T=(k,l,x)=>Object.assign({k:k,l:l,t:'text'},x||{});
const A=(k,l,x)=>Object.assign({k:k,l:l,t:'area'},x||{});
const S=(k,l,opts,x)=>Object.assign({k:k,l:l,t:'sel',opts:opts},x||{});
const storyOpts=()=>['',...(cur()?cur().stories.map(s=>s.title):[])];
const svcShort=n=>{n=String(n==null?'':n).trim();const p=n.split(/[｜|]/)[0].trim()||n;return p.length>30?p.slice(0,30)+'…':p};
const svcOpts=()=>[{v:'',l:''}].concat(cur()?cur().services.filter(s=>s.name).map(s=>({v:s.name,l:svcShort(s.name)})):[]);

const BRAND=[T('name','品牌名稱'),T('identity','身份'),T('job','職業'),A('expertise','專業領域',{rows:3}),A('trait','個人特色',{rows:3}),A('tone','說話語氣',{rows:3}),A('values','價值觀',{rows:3}),A('direction','內容方向',{rows:3}),A('audience','目標客群',{rows:3}),A('diff','差異化',{rows:3}),A('offers','服務與產品',{rows:3}),A('rules','口播固定規則（AI 寫文案一定遵守：公式、秒數、開頭字數、禁用語、簽名等）',{rows:10}),A('ctaLog','已用過的 CTA 紀錄（關鍵字與編號，AI 不會重複使用）',{rows:5})];
const PERSONA=[A('oneLine','一句話定位',{rows:2,ph:'我幫【誰】解決【什麼問題】，用【獨特方式】'}),T('identity','身份'),A('expertise','專業',{rows:3}),A('audience','目標客群',{rows:3}),A('pain','客戶痛點',{rows:3}),A('diff','差異化',{rows:3}),A('trust','可信任理由',{rows:3}),A('pillars','內容支柱',{rows:3,ph:'例如：心態／方法／案例'}),A('tone','語氣風格',{rows:3})];

const ENT={

function fieldHTML(f,val,p){
  const id=p+f.k,v=val==null?'':val;let inner;
  if(f.t==='area')inner='<textarea id="'+id+'" class="inp" rows="'+(f.rows||4)+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
  else if(f.t==='sel'){let o=(typeof f.opts==='function'?f.opts():f.opts).map(x=>typeof x==='object'?x:{v:x,l:x});if(v&&!o.some(x=>x.v===v))o.push({v:v,l:f.svc?svcShort(v):v});inner='<select id="'+id+'" class="inp">'+o.map(x=>'<option value="'+esc(x.v)+'"'+(x.v===v?' selected':'')+'>'+esc(x.l||'（不指定）')+'</option>').join('')+'</select>'}

function modal(o){
  closeModal(true);
  const root=$('#modal-root');
  root.innerHTML='<div class="scrim" data-act="closeModal"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'"><div class="sheet-h"><h3>'+esc(o.title)+'</h3><button class="icon-btn" data-act="closeModal" aria-label="關閉">×</button></div><div class="sheet-b">'+o.body+'</div><div class="sheet-f"></div></div>';
  const ft=$('.sheet-f',root);
  (o.buttons||[]).forEach(b=>{const x=document.createElement('button');x.type='button';x.className='btn '+(b.cls||'');x.textContent=b.label;x.addEventListener('click',()=>b.onClick(x));ft.appendChild(x)});
  root.classList.add('open');document.body.classList.add('noscroll');

}
function closeModal(silent){

  if(UI.confirmRes){const r=UI.confirmRes;UI.confirmRes=null;if(!silent)r(false);else r(false)}

function itemText(ent,r){return ENT[ent].fields.map(f=>r[f.k]?f.l+'：'+r[f.k]:'').filter(Boolean).join('\n')}
const SRC={direct:{icon:'✍️',label:'直接輸入'},interview:{icon:'🎤',label:'14題訪談'}};
function toItem(ent,r){
  const c=ENT[ent];
  const F=k=>c.fields.find(f=>f.k===k)||{};
  const fv=(k,v)=>F(k).svc?svcShort(v):v;
  let title=r[c.title]||'';
  if(!title&&ent==='teardowns')title=short(r.hook||r.content,24);
  const types=c.typeKey==='tags'?String(r.tags||'').split(/[,，、\s]+/).filter(Boolean):(c.typeKey&&r[c.typeKey]?[r[c.typeKey]]:[]);
  const skip={};skip[c.title]=1;if(c.typeKey)skip[c.typeKey]=1;if(c.statusKey)skip[c.statusKey]=1;
  const secs=c.fields.filter(f=>!skip[f.k]&&r[f.k]).map(f=>({k:f.k,l:f.l,v:fv(f.k,r[f.k])}));
  let list;
  if(c.chain)list=c.chain.filter(k=>r[k]).map(k=>({k:k,l:CHAIN_LABEL[k],v:fv(k,r[k])}));
  else list=(c.sum||[]).map(k=>secs.find(s=>s.k===k)).filter(Boolean);
  const lim=c.chain?40:60;
  const more=secs.length>list.length||list.some(s=>s.v.length>lim||s.v.indexOf('\n')>=0);
  return{ent:ent,id:r.id,kind:c.label,title:title||'（未命名）',types:types,ftypes:types,status:c.statusKey?(r[c.statusKey]||''):'',date:r.updatedAt||r.createdAt,secs:secs,list:list,chain:!!c.chain,more:more,text:itemText(ent,r),sub:ent==='assets'?r.type:'',src:ent==='stories'?(r.source||''):'',demo:!!r.isDemo};
}
function itemsOf(ent){const c=cur();return c?c[ent].map(r=>toItem(ent,r)):[]}
function allItems(){let a=[];Object.keys(ENT).forEach(k=>{itemsOf(k).forEach(i=>{i.ftypes=[i.kind];a.push(i)})});return a}

function collectionView(vk,fn,opt){
  VIEWS[vk]=fn;VIEWOPT[vk]=opt||{};
  const f=UI.f[vk]||(UI.f[vk]={q:'',type:'',status:'',sort:'new'});
  const items=fn();
  const types=[...new Set(items.reduce((a,i)=>a.concat(i.ftypes),[]))].filter(Boolean);
  const stats=[...new Set(items.map(i=>i.status))].filter(Boolean);
  const sel=(name,label,arr,val)=>'<select class="inp" data-filter="'+name+'" data-vk="'+vk+'" aria-label="'+label+'"><option value="">'+label+'：全部</option>'+arr.map(x=>'<option value="'+esc(x)+'"'+(x===val?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';
  const sort='<select class="inp" data-filter="sort" data-vk="'+vk+'" aria-label="排序"><option value="new"'+(f.sort==='new'?' selected':'')+'>最新優先</option><option value="old"'+(f.sort==='old'?' selected':'')+'>最舊優先</option><option value="title"'+(f.sort==='title'?' selected':'')+'>依標題</option></select>';
  const row=(types.length?sel('type',opt&&opt.typeLabel||'類型',types,f.type):'')+(stats.length?sel('status','狀態',stats,f.status):'')+sort;
  return '<div class="filters"><input type="search" class="inp" placeholder="搜尋關鍵字" value="'+esc(f.q)+'" data-filter="q" data-vk="'+vk+'" aria-label="搜尋關鍵字"><div class="frow">'+row+'</div></div><div id="res-'+vk+'">'+resultsHTML(vk)+'</div>';
}
function resultsHTML(vk){
  const all=VIEWS[vk]();const f=UI.f[vk];const q=f.q.toLowerCase();
  let list=all.filter(i=>(!q||(i.title+'\n'+i.text).toLowerCase().indexOf(q)>=0)&&(!f.type||i.ftypes.indexOf(f.type)>=0)&&(!f.status||i.status===f.status));
  if(f.sort==='title')list.sort((a,b)=>a.title.localeCompare(b.title,'zh-Hant'));
  if(f.sort==='old')list.sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
  if(f.sort==='new')list.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  if(!list.length)return '<div class="empty">'+(all.length?'沒有符合條件的項目，請調整搜尋或篩選。':'還沒有資料。按上方按鈕新增第一筆。')+'</div>';
  return list.map(i=>cardHTML(i,VIEWOPT[vk].showKind)).join('');
}
function cardHTML(it,showKind){
  const key=it.ent+':'+it.id,open=!!UI.exp[key];
  const att='data-ent="'+it.ent+'" data-id="'+esc(it.id)+'"';
  let badges='';
  if(showKind)badges+='<span class="badge gold">'+esc(it.kind)+'</span>';
  if(it.sub)badges+='<span class="badge">'+esc(it.sub)+'</span>';
  if(!showKind)it.types.forEach(t=>{const tp=it.ent==='topics';badges+='<span class="badge'+(tp?' gold':'')+'">'+esc(tp?t.replace(/選題$/,''):t)+'</span>'});
  if(it.status)badges+='<span class="badge gold">'+esc(it.status)+'</span>';
  if(it.date)badges+='<span class="badge">'+fdate(it.date)+'</span>';
  if(it.demo)badges+='<span class="badge">示範資料</span>';
  let meta='';
  if(it.ent==='stories'&&it.src){const s=SRC[it.src]||{icon:'•',label:it.src};meta='<p class="meta">建立方式｜'+s.icon+' '+esc(s.label)+'</p>'}
  let body;
  if(it.chain)body='<ul class="chain">'+it.list.map(s=>'<li><small>'+esc(s.l)+'</small><span class="v">'+esc(open?s.v:short(s.v,40))+'</span></li>').join('')+'</ul>';
  else if(open)body='<dl class="full">'+it.secs.map(s=>'<div class="sec"><dt>【'+esc(s.l)+'】</dt><dd>'+esc(s.v)+'</dd></div>').join('')+'</dl>';
  else body=it.list.map(s=>'<p class="kv"><b>'+esc(s.l)+'</b><span>'+esc(s.v)+'</span></p>').join('');
  const toggle=it.more?'<button class="btn sm ghost wide" data-act="toggleItem" '+att+' aria-expanded="'+open+'">'+(open?'收合':'查看全文')+'</button>':'';
  let extra='';
  if(it.ent==='topics')extra='<button class="btn sm gold" data-act="topicToScript" data-id="'+esc(it.id)+'">製作文案</button>';
  if(it.ent==='scripts')extra='<button class="btn sm gold" data-act="edit" '+att+'>開啟編輯</button>';
  const edit=it.ent==='scripts'?'':'<button class="btn sm" data-act="edit" '+att+'>編輯</button>';
  return '<article class="card item" data-card="'+esc(key)+'" data-sk="'+(showKind?1:0)+'"><h4>'+esc(it.title)+'</h4><div class="badges">'+badges+'</div>'+meta+body+'<div class="acts">'+toggle+extra+edit+'<button class="btn sm" data-act="copyItem" '+att+'>複製</button><button class="btn sm" data-act="dupItem" '+att+'>副本</button><button class="btn sm danger" data-act="delItem" '+att+'>刪除</button></div></article>';
}

  if(sc.length)L.push('【短影音文案】\n'+sc.slice(-5).map(s=>'- '+s.title+(s.hook?'｜開頭：'+short(s.hook,40):'')).join('\n'));

/* ============ 雲端同步（選用） ============
   資料仍以這台裝置的 localStorage 為主。填入後端網址與同步密碼後：
   - 修改會自動上傳到你自己的 Cloudflare 後端（每次上傳雲端都保留一個版本）
   - 回到頁面時會下載其他裝置的更新
   - 兩邊同時改過時，不會自動覆蓋，會讓你選
   AI 也會改走同一個後端，API Key 不放在網頁。 */
function syncDefaults(){return {url:'',token:'',auto:true,rev:0,sig:'',dirty:false,last:'',state:'ok',err:'',busy:false,again:false,applying:false,pending:null,cloud:null,timer:null,poll:null}}
function loadSync(){
  const d=syncDefaults();
  try{const s=JSON.parse(localStorage.getItem(APP.K.sync)||'{}');d.url=s.url||'';d.token=s.token||'';d.auto=s.auto!==false;d.rev=Number(s.rev)||0;d.sig=s.sig||'';d.dirty=!!s.dirty;d.last=s.last||''}catch(e){}
  return d;
}
function saveSync(){try{localStorage.setItem(APP.K.sync,JSON.stringify({url:SYNC.url,token:SYNC.token,auto:SYNC.auto,rev:SYNC.rev,sig:SYNC.sig,dirty:SYNC.dirty,last:SYNC.last}))}catch(e){}}
const backendOn=()=>!!(SYNC.url&&SYNC.token);
const sigOf=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return s.length+':'+(h>>>0).toString(36)};
const clientsSig=()=>sigOf(JSON.stringify(DB.clients));
const timeOf=s=>{const d=new Date(s);return isNaN(d)?'':pad(d.getHours())+':'+pad(d.getMinutes())};
const SAFE_PAGES=['dashboard','clients','stories','services','cases','topics','frameworks','funnels','ctas','assets','studio'];

async function cloudFetch(path,o){
  o=o||{};
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),o.timeout||30000);
  try{
    const headers={};if(!o.noAuth)headers.Authorization='Bearer '+SYNC.token;if(o.body)headers['content-type']='application/json';
    const res=await fetch(SYNC.url.replace(/\/+$/,'')+path,{method:o.method||'GET',signal:ctl.signal,headers:headers,body:o.body,cache:'no-store'});
    let j=null;try{j=await res.json()}catch(e){}
    return{ok:res.ok,status:res.status,json:j};
  }catch(e){return{ok:false,status:0,net:true,error:e.name==='AbortError'?'連線逾時':'無法連到雲端後端'}}
  finally{clearTimeout(to)}
}
const cloudErr=r=>r.net?r.error:(r.status===401?'同步密碼不正確':r.status===403?'後端拒絕了這個網頁來源（請檢查後端的 ALLOWED_ORIGINS）':(r.json&&r.json.error&&r.json.error.message)||('後端回應 HTTP '+r.status));

function syncStatusText(){
  if(!backendOn())return '尚未啟用';
  if(SYNC.state==='busy')return '同步中…';
  if(SYNC.state==='err')return '同步失敗：'+SYNC.err;
  if(SYNC.state==='conflict')return '雲端和這台的資料不一樣，等你選擇要用哪一份';
  if(SYNC.state==='offline')return '目前連不上雲端，修改先存在這台，連線後會自動補上傳';
  if(SYNC.pending)return '雲端有更新，離開編輯頁後會自動套用';
  if(SYNC.dirty)return SYNC.auto?'有尚未上傳的修改，稍後自動上傳':'有尚未上傳的修改，請按「立即同步」';
  return '已同步'+(SYNC.last?'（最近一次 '+fdate(SYNC.last)+' '+timeOf(SYNC.last)+'）':'');
}
function updateSyncDot(){
  const d=$('#syncdot');if(!d)return;
  if(!backendOn()){d.classList.add('hide');return}
  d.classList.remove('hide','ok','busy','warn','err');
  d.classList.add(SYNC.state==='busy'?'busy':SYNC.state==='err'?'err':(SYNC.state==='offline'||SYNC.state==='conflict'||SYNC.dirty||SYNC.pending)?'warn':'ok');
  const t='雲端同步：'+syncStatusText();d.setAttribute('aria-label',t);d.title=t;
}
function setSyncState(state,err){
  SYNC.state=state;SYNC.err=err||'';updateSyncDot();
  const el=$('#syncstat');if(el)el.textContent=syncStatusText();
}
function backupLocal(){try{localStorage.setItem(APP.K.prev,JSON.stringify({ts:iso(),data:DB}))}catch(e){}}

function syncAfterPersist(){
  if(!backendOn()||SYNC.applying)return;
  const dirty=clientsSig()!==SYNC.sig;
  if(dirty!==SYNC.dirty){SYNC.dirty=dirty;saveSync()}
  updateSyncDot();
  if(dirty&&SYNC.auto&&SYNC.state!=='conflict')schedulePush();
}
function schedulePush(){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>{pushNow()},1500)}

async function pushNow(force){
  if(!backendOn())return false;
  if(SYNC.busy){SYNC.again=true;return false}
  if(SYNC.state==='conflict'&&!force)return false;
  if(!SYNC.dirty&&!force)return true;
  SYNC.busy=true;setSyncState('busy');
  const mySig=clientsSig();
  const r=await cloudFetch('/api/data',{method:'PUT',timeout:60000,body:JSON.stringify({baseRev:SYNC.rev,data:{dataVersion:APP.V,clients:DB.clients}})});
  SYNC.busy=false;
  if(r.ok&&r.json&&Number.isInteger(r.json.rev)){
    SYNC.rev=r.json.rev;SYNC.sig=mySig;SYNC.last=iso();SYNC.dirty=clientsSig()!==SYNC.sig;saveSync();
    setSyncState('ok');
    if(SYNC.dirty&&SYNC.auto)schedulePush();
    SYNC.again=false;
    return true;
  }
  if(r.status===409){await onConflict();return false}
  if(r.net){setSyncState('offline');return false}
  setSyncState('err',cloudErr(r));return false;
}

async function onConflict(){
  const r=await cloudFetch('/api/data');
  if(!r.ok||!r.json||!r.json.data){setSyncState(r.net?'offline':'err',cloudErr(r));return}
  // 如果雲端內容其實和這台一樣（例如上次上傳成功但回應遺失），直接對齊版本號，不打擾使用者
  if(sigOf(JSON.stringify(r.json.data.clients||[]))===clientsSig()){SYNC.rev=r.json.rev;SYNC.sig=clientsSig();SYNC.dirty=false;SYNC.last=iso();saveSync();setSyncState('ok');return}
  SYNC.cloud={rev:r.json.rev,data:r.json.data,updatedAt:r.json.updatedAt};
  setSyncState('conflict');showConflict();
}

async function pullNow(o){
  o=o||{};
  if(!backendOn()||SYNC.busy)return null;
  const r=await cloudFetch('/api/data?since='+SYNC.rev);
  if(!r.ok||!r.json){if(r.net)setSyncState('offline');else setSyncState('err',cloudErr(r));return r}
  if(SYNC.state==='conflict')return r;
  const cloud=r.json;
  if(cloud.unchanged){setSyncState('ok');return r}
  if(cloud.rev===0){ // 雲端是空的（例如剛重建資料庫）：把這台的資料上傳
    setSyncState('ok');
    if(DB.clients.length){SYNC.rev=0;SYNC.dirty=true;saveSync();await pushNow(true)}
    return r;
  }
  if(cloud.rev>SYNC.rev){
    if(SYNC.dirty){SYNC.cloud={rev:cloud.rev,data:cloud.data,updatedAt:cloud.updatedAt};setSyncState('conflict');showConflict();return r}
    SYNC.pending={rev:cloud.rev,data:cloud.data};
    setSyncState('ok');
    tryApplyPending(false);
    return r;
  }
  return r;
}
async function syncTick(){
  if(!backendOn()||!SYNC.auto)return;
  await pullNow();
  if(SYNC.dirty&&SYNC.state!=='conflict'&&!SYNC.busy)await pushNow();
}

function canApplyNow(){

function tryApplyPending(resetScroll){
  if(!SYNC.pending)return false;

  const p=SYNC.pending;SYNC.pending=null;

}
function applyCloud(data,rev,quiet,resetScroll){
  if(!data||!Array.isArray(data.clients))return false;
  if(Number(data.dataVersion||1)>APP.V){SYNC.pending=null;setSyncState('err','雲端資料來自較新版本的程式，請重新整理網頁取得最新版');return false}
  backupLocal();
  SYNC.applying=true;
  try{DB=migrate({dataVersion:data.dataVersion||1,currentClientId:DB.currentClientId,clients:data.clients});persist()}finally{SYNC.applying=false}
  SYNC.rev=rev;SYNC.sig=clientsSig();SYNC.dirty=false;SYNC.last=iso();SYNC.cloud=null;SYNC.pending=null;saveSync();
  setSyncState('ok');
  render(!resetScroll);

  return true;
}

async function linkSync(){
  const r=await cloudFetch('/api/data');
  if(!r.ok||!r.json)return{ok:false,msg:cloudErr(r)};
  const cloud=r.json,hasLocal=DB.clients.length>0;
  if(cloud.rev===0){
    SYNC.rev=0;SYNC.sig='';SYNC.dirty=hasLocal;SYNC.cloud=null;saveSync();
    if(hasLocal){const ok=await pushNow(true);return{ok:ok,msg:ok?'雲端還是空的，已把這台的資料上傳（'+DB.clients.length+' 個業主）。之後的修改會自動同步。':'上傳沒有成功，請稍後按「立即同步」。'}}
    SYNC.sig=clientsSig();saveSync();setSyncState('ok');
    return{ok:true,msg:'雲端和這台都還沒有資料。之後的修改會自動同步。'};
  }
  if(!hasLocal){applyCloud(cloud.data,cloud.rev,true);return{ok:true,msg:'已從雲端下載資料（'+(cloud.data.clients||[]).length+' 個業主）。'}}
  if(sigOf(JSON.stringify(cloud.data.clients||[]))===clientsSig()){SYNC.rev=cloud.rev;SYNC.sig=clientsSig();SYNC.dirty=false;SYNC.last=iso();SYNC.cloud=null;saveSync();setSyncState('ok');return{ok:true,msg:'雲端和這台的資料相同，已連線。'}}
  SYNC.cloud={rev:cloud.rev,data:cloud.data,updatedAt:cloud.updatedAt,first:true};SYNC.dirty=true;saveSync();
  setSyncState('conflict');showConflict();
  return{ok:true,pendingChoice:true};
}

/* ============ AI 呼叫層（可替換） ============
   callAI() 是唯一對外連線的地方。
   - 沒設定 Endpoint / Model / API Key → 回傳 {demo:true}，各功能改用內建示範結果。
   - Endpoint 含 anthropic.com → 使用 Anthropic Messages 格式。
   - 其他 → 使用 OpenAI 相容的 chat/completions 格式。
   要換成自己的後端，只需要改這個函式。 */
async function callAI(o){
  if(backendOn())return callBackendAI(o);
  if(!SET.endpoint||!SET.model||!SET.key)return{demo:true};
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),90000);let stage=0;
  try{
    const isA=/anthropic\.com/i.test(SET.endpoint);
    const isResponses=/\/responses\/?$/i.test(SET.endpoint);
    const msgs=(o.history||[]).concat([{role:'user',content:o.prompt}]);
    let res;
    if(isA)res=await fetch(SET.endpoint,{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json','x-api-key':SET.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:SET.model,max_tokens:4096,system:o.system,messages:msgs})});
    else if(isResponses)res=await fetch(SET.endpoint,{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json','Authorization':'Bearer '+SET.key},body:JSON.stringify({model:SET.model,input:[{role:'system',content:o.system}].concat(msgs),max_output_tokens:4096})});
    else res=await fetch(SET.endpoint,{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json','Authorization':'Bearer '+SET.key},body:JSON.stringify({model:SET.model,messages:[{role:'system',content:o.system}].concat(msgs)})});
    stage=1;
    if(!res.ok){
      let detail='',raw='';
      try{raw=await res.text();const payload=JSON.parse(raw);detail=payload&&payload.error&&(payload.error.message||payload.error.type||payload.error.code)||''}catch(e){detail=raw.trim()}
      const status=res.status;
      const reason=status===400?'請檢查 Model 名稱與請求格式':status===401?'API Key 無效或未正確授權':status===403?'帳號、專案或 API Key 權限不足':status===404?'Endpoint 網址或 Model 不存在':status===429?'用量、額度或請求頻率受限':status>=500?'AI 服務暫時發生問題':'請檢查 API 設定';
      if(detail&&SET.key)detail=detail.split(SET.key).join('[已隱去 API Key]');
      throw new Error('HTTP '+status+'：'+reason+(detail?'\n服務回覆：'+short(detail,260):''));
    }
    const j=await res.json();
    const text=isA?(j.content||[]).map(x=>x.text||'').join(''):isResponses?((j.output||[]).flatMap(x=>x.content||[]).filter(x=>x.type==='output_text'||x.text).map(x=>x.text||'').join('')||j.output_text||''):((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'');
    if(!text)throw new Error('AI 回覆是空的');
    return{demo:false,text:text};
  }catch(e){
    const netErr=stage===0&&e.name!=='AbortError'&&(e instanceof TypeError||/failed to fetch|networkerror|load failed/i.test(e.message||''));
    const message=e.name==='AbortError'?'連線逾時（90 秒沒有收到回覆）':netErr?'瀏覽器無法連到 API（Failed to fetch）。':e.message||'連線失敗';
    return{demo:true,error:message,net:netErr};
  }
  finally{clearTimeout(to)}
}

/* ============ 內建示範產生器（沒有 API 時使用） ============
   這些只是「示範結果」：只使用完整句子，不把欄位原文截斷後塞進標題或口播。 */
const sentList=s=>String(s==null?'':s).replace(/\r/g,'').match(/[^。！？!?；;\n]+[。！？!?；;]?/g)||[];
function sent(s,max){
  const a=sentList(s).map(x=>x.trim()).filter(Boolean);let o='';
  for(let i=0;i<a.length;i++){if((o+a[i]).length>max)break;o+=a[i]}
  if(o)return o;
  const b=String(s==null?'':s).split(/[，,、]/).map(x=>x.trim()).filter(Boolean);
  return b[0]&&b[0].length<=max?b[0]:'';
}
const clause=(s,max)=>sent(s,max).replace(/[。！？!?；;，,、\s]+$/,'');

  const mk=(title,reason,angle,message,goal,story)=>({title:title,type:'',reason:why(reason),audience:audFull,story:story||'',angle:angle,message:message,goal:goal});

function demoScript(c,t){

  const st=(t.story&&v.st.find(s=>s.title===t.story))||v.st[0];
  const o={};
  o.hook=pain?'你是不是也常常這樣：'+pain+'？':'有一件事，我想跟你好好聊一聊。';
  o.problem='今天這支影片，我想跟你聊'+(t.title?'「'+t.title+'」':'一個很多人都遇過的狀況')+'。';
  const sc=st?sent(st.content||[st.background,st.conflict].filter(Boolean).join('，'),110):'';
  o.story=sc||'【請補充：用 2–3 句說出你自己的真實經歷，當時發生了什麼、你怎麼想】';
  const tw=st&&st.twist?sent(st.twist,60):'';
  o.twist=tw&&o.story.indexOf(tw)<0?tw:'';
  o.body=sent(t.message,90)||'【請補充：這支影片想讓觀眾帶走的一個重點】';
  o.solution=(acq&&v.svc)?'如果你也正好卡在這裡，我平常會用「'+svcShort(v.svc.name)+'」陪大家一起整理。':'';
  o.ending='先不用急著一次做很多，把這一件事看清楚就好。';

  o.full=composeFull(o);return o;
}

function demoTeardown(text){
  const s=(String(text).replace(/\r/g,'').match(/[^。！？!?\n]+[。！？!?]?/g)||[]).map(x=>x.trim()).filter(Boolean);
  const ctaRe=/留言|私訊|點擊|連結|報名|加入|追蹤|關注|預約|領取/;
  const cta=s.slice().reverse().find(x=>ctaRe.test(x))||'';
  const twist=s.find(x=>/但是|可是|沒想到|後來|直到|結果|其實|然而/.test(x))||'';
  const emo=[['焦慮|擔心|害怕|壓力','焦慮／擔心'],['後悔|遺憾|可惜','後悔／遺憾'],['開心|成功|終於|驚喜','喜悅／成就'],['生氣|崩潰|受不了','憤怒／崩潰']].filter(p=>new RegExp(p[0]).test(text)).map(p=>p[1]);
  const story=/我(曾|以前|當時|那時|在|有一次)/.test(text)?'第一人稱經歷':(/客戶|學員|個案|朋友/.test(text)?'第三人稱案例':'以觀點與論述為主，幾乎沒有故事');
  return{hook:s[0]||'',structure:'共 '+s.length+' 句：開頭'+(/[？?]/.test(s[0]||'')?'用提問':'用陳述')+'切入'+(twist?' → 中段出現轉折':'')+(cta?' → 結尾導向行動':' → 結尾沒有明確行動呼籲'),storyWay:story,emotion:emo.length?emo.join('、'):'情緒起伏不明顯，以資訊為主',twist:twist,cta:cta,borrow:'可借鑑：①開頭的切入方式 ②段落的先後順序 ③結尾把互動導向行動。只借結構，不借原句。'};
}
function demoRewrite(c,td){
  const a=td||{},shape=(a.structure||'')+' '+(a.storyWay||''),hasCTA=!!String(a.cta||'').trim();
  const v=ctxVals(c),st=v.st[0];
  const base=demoScript(c,{type:hasCTA?'獲客':'',goal:hasCTA?'依參考結構保留自然的行動邀請':''});
  if(/提問|問題/.test(shape)&&v.pain)base.hook='你是不是也遇過：'+sent(v.pain,40).replace(/[。！？!?]+$/,'')+'？';
  else if(/陳述|觀點/.test(shape)&&v.exp)base.hook='我在'+clause(v.exp,24)+'的工作裡，最常看到一件事。';
  if(/第一人稱|個人經歷/.test(a.storyWay||'')&&st)base.story=sent(st.content||[st.background,st.conflict].filter(Boolean).join('，'),110)||base.story;
  if(a.twist&&st&&st.twist)base.twist=sent(st.twist,60);
  if(!hasCTA)base.cta='';
  base.full=composeFull(base);
  return base.full;
}
function demoChat(q,c){
  const v=ctxVals(c),have=relatedRefs(c),b=c.brand,p=c.persona;
  const line=(l,x)=>x?'・'+l+'：'+x:'';
  const lines=a=>a.filter(Boolean).join('\n');
  const none='目前這部分資料還是空的，請先補上，我才有東西可以整理。';
  let tip;
  if(/核心能力|核心競爭|專業|擅長|強項|優勢|定位|我是誰/.test(q)){
    const L=lines([line('一句話定位',p.oneLine),line('身份',b.identity||p.identity),line('專業領域',b.expertise||p.expertise),line('個人特色',b.trait),line('差異化',b.diff||p.diff),line('可信任理由',p.trust)]);
    tip=L?'依你目前的品牌記憶與人設，你的核心能力整理如下：\n'+L:none;
  }
  else if(/CTA|行動呼籲|留言關鍵字/i.test(q))tip='CTA 的檢查重點：\n① 動作只有一個（留言、私訊或點連結，擇一）\n② 看完內容後，這個動作是否是最自然的下一步\n③ 是否對應到你的某一項服務'+(v.svc?'（例如「'+svcShort(v.svc.name)+'」）':'')+'\n④ 不是每支影片都需要銷售型 CTA，信任型內容可以用互動邀請收尾';
  else if(/故事/.test(q)&&/適合|拍|影片/.test(q))tip='判斷故事適不適合拍成影片：\n① 30 秒內能講完起因與轉折嗎\n② 有沒有一句讓人記住的體悟\n③ 目標客群看了會不會想到自己'+(v.st.length?'\n你目前有 '+v.st.length+' 則故事：'+v.st.slice(0,5).map(s=>'「'+s.title+'」').join('、')+'。可從轉折最明確的那則開始。':'');
  else if(/不像我|像我|語氣|自然|口語|改寫/.test(q))tip='可以先檢查三件事：\n① 有沒有用你平常說話的詞（目前記錄的語氣：'+(v.tone?sent(v.tone,50)||v.tone:'尚未填寫，建議先補上')+'）\n② 有沒有一句只有你會說的話\n③ 念出來順不順，把書面語改成對一個人說話的口吻';
  else if(/流量|獲客/.test(q))tip='流量型內容重在「很多人都有感」，獲客型內容重在「對的人想找你」。\n'+(v.pain?'如果題目直接點出「'+clause(v.pain,24)+'」這類痛點，並能自然帶到你的服務，偏獲客；':'如果題目直接點出目標客群的痛點，並能自然帶到你的服務，偏獲客；')+'如果是大眾迷思或金句，偏流量。';
  else if(/服務|產品|價格|方案/.test(q))tip=real(c,'services').length?'你目前的服務與產品：\n'+real(c,'services').map(s=>'・'+svcShort(s.name)+(s.solves?'：'+sent(s.solves,40):'')).join('\n'):none;
  else if(/客群|受眾|目標客戶|痛點/.test(q))tip=lines([line('目標客群',b.audience||p.audience),line('客戶痛點',p.pain)])||none;
  else if(/案例/.test(q))tip=real(c,'cases').length?'你目前可引用的真實案例：\n'+real(c,'cases').map(s=>'・'+s.title).join('\n'):'目前沒有可引用的真實案例（示範與測試資料不計入）。請先到「客戶案例」補上。';
  else if(/選題|題目|題材/.test(q))tip=real(c,'topics').length?'你最近的選題：\n'+real(c,'topics').slice(-6).map(s=>'・'+s.title+(s.type?'（'+s.type.replace(/選題$/,'')+'）':'')).join('\n'):'目前還沒有選題，可以到「選題建議」產生。';
  else tip='示範模式只能依關鍵字回答，這個問題需要真正的 AI 才能判斷。\n\n我目前讀到的資料：\n'+(lines([line('品牌',b.name||c.name),line('一句話定位',p.oneLine),line('目標客群',b.audience||p.audience),v.st.length?'・品牌故事 '+v.st.length+' 則':'',real(c,'services').length?'・服務 '+real(c,'services').length+' 項':''])||'目前資料還是空的。');
  return tip+'\n\n（示範回答：尚未設定 AI API，以上是依關鍵字與你的資料整理的內容，不是 AI 判斷。已讀取：'+(have.join('、')||'尚無，請先填寫品牌記憶')+'）';

function pageTitle(p){let t='';GROUPS.forEach(g=>g.items.forEach(i=>{if(i[0]===p)t=i[1]}));return t||(p==='script'?'文案編輯':'首頁')}

/* ============ 導覽與渲染 ============ */
function navHTML(active){return GROUPS.map(g=>(g.t?'<div class="mgroup">'+g.t+'</div>':'')+g.items.map(i=>'<a class="mlink'+(i[0]===active?' on':'')+'" href="#/'+i[0]+'" data-act="closeModal">'+i[1]+'</a>').join('')).join('')}
function renderChrome(page){
  $('#sidebar').innerHTML='<div class="brand">短影音獲客工作台</div>'+navHTML(page);
  const tabs=[['dashboard','首頁','home'],['topics','選題','topics'],['studio','工作區','studio'],['chat','AI顧問','chat']];
  $('#tabbar').innerHTML=tabs.map(t=>'<a href="#/'+t[0]+'" class="'+(t[0]===page||(t[0]==='studio'&&page==='script')?'on':'')+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[t[2]]+'</svg>'+t[1]+'</a>').join('')+'<button data-act="menu"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON.more+'</svg>更多</button>';
  const c=cur();$('#clientpill').textContent=c?c.name:'尚未建立業主';
  $('#ptitle').textContent=pageTitle(page);document.title=pageTitle(page)+'｜短影音內容獲客工作台';updateSyncDot();
}
function route(){const h=location.hash.replace(/^#\/?/,'')||'dashboard';const p=h.split('/');return{page:PAGES[p[0]]?p[0]:'dashboard',arg:p[1]||''}}
function render(keepScroll){
  if(typeof AUTO_T!=='undefined'&&AUTO_T){clearTimeout(AUTO_T);AUTO_T=null;autoSaveScript(AUTO_SID)}
  closeModal(true);
  const r=route();renderChrome(r.page);
  let html;
  try{html=(!cur()&&NOCLIENT_OK.indexOf(r.page)<0)?needClient():PAGES[r.page](r.arg)}catch(e){console.error(e);html='<div class="empty">這個頁面發生錯誤，請重新整理。<br>'+esc(e.message)+'</div>'}
  $('#view').innerHTML=html;
  if(!keepScroll)window.scrollTo(0,0);
  if(r.page==='chat'){const l=$('#chatlog');if(l&&l.lastElementChild)l.lastElementChild.scrollIntoView({block:'end'})}
}
window.addEventListener('hashchange',()=>{if(!tryApplyPending(true))render()});

/* 訪談建立故事（第一版為文字訪談；之後可把每題答案交給 AI 追問） */
function showInterview(){
  const iv=UI.iv,q=INTERVIEW[iv.i],last=iv.i===INTERVIEW.length-1;
  modal({title:'故事訪談 '+(iv.i+1)+' / '+INTERVIEW.length,body:'<p>'+esc(q.q)+'</p><div class="fld"><textarea id="ivans" class="inp" rows="6" placeholder="想到什麼就寫什麼，不確定可以先留白，之後再編輯">'+esc(iv.a[iv.i]||'')+'</textarea></div>',buttons:[
   {label:iv.i?'上一題':'取消',onClick:()=>{iv.a[iv.i]=$('#ivans').value;if(iv.i){iv.i--;showInterview()}else closeModal()}},
   {label:last?'完成並建立':'下一題',cls:'gold',onClick:()=>{iv.a[iv.i]=$('#ivans').value;if(!last){iv.i++;showInterview();return}finishInterview()}}]});
}
function finishInterview(){
  const c=cur(),st={id:uid(),createdAt:iso(),source:'interview'};ENT.stories.fields.forEach(f=>st[f.k]='');
  INTERVIEW.forEach((q,i)=>{const a=(UI.iv.a[i]||'').trim();if(!a)return;st[q.k]=st[q.k]?st[q.k]+'\n'+a:a});
  if(!st.title)st.title=clause(st.content||st.background,18)||'訪談故事';
  c.stories.push(st);persist();UI.iv=null;render();
  modal({title:'✓ 故事已建立',body:'<p class="muted">14 題訪談已完成，內容已保存到品牌故事。</p><h4>'+esc(st.title)+'</h4><p class="meta">建立方式｜🎤 14題訪談</p>',buttons:[
    {label:'回到故事列表',onClick:()=>{closeModal(true);window.scrollTo(0,0)}},
    {label:'查看故事',cls:'gold',onClick:()=>{closeModal(true);UI.f.stories={q:'',type:'',status:'',sort:'new'};UI.exp['stories:'+st.id]=1;render(true);focusCard('stories:'+st.id)}}]});
}
ACT.interview=()=>{UI.iv={i:0,a:[]};showInterview()};

/* 選題 */
ACT.pickTopicType=t=>{UI.topicType=t.dataset.v;$$('.chip[data-act="pickTopicType"]').forEach(b=>b.classList.toggle('on',b.dataset.v===UI.topicType))};
ACT.genTopics=async t=>{
  const c=cur();setBusy(t,true,'產生中…');
  const type=UI.topicType;
  const prompt='請依品牌資料，提出 4 個「'+type+'」的短影音選題。每個選題要說明為什麼適合這位業主、使用哪一則既有故事（story 欄位請填故事標題，沒有就留空）。\n規則：title 必須是一句獨立、完整的短影音標題（約 30 字內），不得夾帶客群描述、現況、推薦理由或其他欄位內容，也不得用「…」截斷；各欄位資料必須分開填寫，彼此不可混用。\n輸出 JSON 陣列，每個物件包含欄位：title, type（固定填「'+type+'」）, goal, audience, reason, story, angle, message。';
  const r=await aiJSON(c,prompt,()=>demoTopics(c,type));
  setBusy(t,false);
  let arr=Array.isArray(r.data)?r.data:(r.data&&r.data.topics)||[];
  arr=arr.map(x=>({title:String(x.title||'').replace(/\.{3}|…/g,'').trim(),type:type,goal:String(x.goal||''),audience:String(x.audience||''),reason:String(x.reason||''),story:String(x.story||''),angle:String(x.angle||''),message:String(x.message||'')})).filter(x=>x.title);
  if(!arr.length){toast('沒有取得選題，請再試一次');return}
  UI.sugg=arr;const box=$('#sugg');if(box)box.innerHTML=suggHTML();
  toast(r.demo?'已產生示範選題（尚未設定 AI API）':'已產生選題建議',3200);
};
function suggToTopic(s){return{title:s.title,type:s.type||TOPIC_TYPES[0],goal:s.goal,audience:s.audience,reason:s.reason,story:s.story,angle:s.angle,message:s.message,status:'待製作'}}
ACT.suggSave=t=>{const c=cur(),i=+t.dataset.i,s=UI.sugg[i];if(!s)return;c.topics.push(Object.assign({id:uid(),createdAt:iso()},suggToTopic(s)));UI.sugg.splice(i,1);persist();toast('已保存到我的選題');render(true)};
ACT.suggEdit=t=>{const i=+t.dataset.i,s=UI.sugg[i];if(!s)return;openForm('topics',null,suggToTopic(s),()=>{UI.sugg.splice(i,1)})};

/* 文案 */
function mkScript(x){return Object.assign({id:uid(),createdAt:iso(),title:'未命名短影音文案',candidates:[],goal:'',hook:'',problem:'',story:'',twist:'',body:'',solution:'',ending:'',cta:'',full:'',status:'草稿',topicId:'',shoot:{}},x||{})}

ACT.topicToScript=t=>{const c=cur(),tp=c.topics.find(x=>x.id===t.dataset.id);if(!tp)return;const s=mkScript({title:tp.title,goal:tp.goal||'',topicId:tp.id});c.scripts.push(s);if(tp.status==='待製作')tp.status='製作中';persist();toast('已建立文案，按「用 AI 產生文案」開始');location.hash='#/script/'+s.id};
ACT.pickTopic=()=>{

  modal({title:'選一個選題',body:c.topics.map(tp=>'<button class="btn block" style="margin-bottom:8px;justify-content:flex-start;text-align:left;height:auto;padding:12px 14px" data-act="topicToScript" data-id="'+esc(tp.id)+'">'+esc(tp.title)+'</button>').join('')});

function curScript(){const id=route().arg;const c=cur();return c?c.scripts.find(x=>x.id===id):null}
function readScript(s){if(!document.getElementById('scr_'+s.id))return false;const v=readFields(ENT.scripts.fields,'s_');Object.assign(s,v);const sh={};SHOOT.forEach(p=>{const e=$('#sh_'+p[0]);sh[p[0]]=e?e.value.trim():''});s.shoot=sh;s.updatedAt=iso();return true}
function fillScript(o){ENT.scripts.fields.forEach(f=>{if(o[f.k]!=null&&f.k!=='title'&&f.k!=='status'&&f.k!=='goal'){const e=$('#s_'+f.k);if(e)e.value=o[f.k]}})}
ACT.saveScript=()=>{const s=curScript();if(!s)return;readScript(s);if(!s.title){toast('請填寫標題');return}persist();toast('已保存')};
ACT.composeScript=()=>{const o={};SECTIONS.forEach(k=>{const e=$('#s_'+k);o[k]=e?e.value.trim():''});$('#s_full').value=composeFull(o);toast('已依段落組合，記得保存')};
ACT.copyScript=()=>{const e=$('#s_full');copyText(e?e.value:'')};
const LABEL_LEAK=/(目標客群|內容切角|核心訊息|推薦理由|使用的故事|寫作方向)\s*[：:]/;
function cleanSpoken(t){const seen={},out=[];String(t||'').split(/\n+/).forEach(x=>{const k=x.replace(/\s+/g,'');if(!k||seen[k])return;seen[k]=1;out.push(x.trim())});return out.join('\n\n')}
/* ===== 文案產生：多版本候選、暫存、不怕切頁 ===== */
let AUTO_T=null,AUTO_SID='';
function autoSaveScript(sid){
  const c=cur();const s=c&&c.scripts.find(x=>x.id===sid);if(!s)return;
  const old=s.title;if(!readScript(s))return;if(!s.title)s.title=old;
  persist();const e=$('#autosv');if(e){const d=new Date();e.textContent='已自動暫存 '+pad(d.getHours())+':'+pad(d.getMinutes())}
}
function onScriptEdit(e){
  if(route().page!=='script'||!e.target.closest||!e.target.closest('#view'))return;
  AUTO_SID=route().arg;clearTimeout(AUTO_T);AUTO_T=setTimeout(()=>{AUTO_T=null;autoSaveScript(AUTO_SID)},800);
}
document.addEventListener('input',onScriptEdit);document.addEventListener('change',onScriptEdit);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&AUTO_T){clearTimeout(AUTO_T);AUTO_T=null;autoSaveScript(AUTO_SID)}});

function bannedWords(c){
  const txt=[c.brand.tone,c.brand.trait,c.brand.values,c.persona.tone].filter(Boolean).join('\n'),out=[];let inAvoid=false;
  txt.split(/\n/).forEach(line=>{
    if(!line.trim())inAvoid=false;
    if(/(避免|不要|禁止|不得|不可)\s*[：:]\s*$/.test(line.trim()))inAvoid=true;
    if(inAvoid||/(不要|避免|禁止|不得|不可)/.test(line))(line.match(/[「『]([^」』]{1,60})[」』]/g)||[]).forEach(m=>m.slice(1,-1).split(/[、，,／\/]/).forEach(w=>{w=w.trim();if(w&&w.length<=8&&out.indexOf(w)<0)out.push(w)}));
  });
  return out;
}
const CAND_KEYS=SECTIONS.concat(['full']);
function candHTML(s){
  const a=s.candidates||[];if(!a.length)return '';
  const bw=bannedWords(cur());
  return '<div class="card" id="cands"><h3>AI 產生的版本</h3><p class="muted small">這些版本會自動保留在這支文案裡，離開頁面也不會消失。選一個「使用這版」，會填進上面的欄位。</p>'
   +a.map((v,i)=>{
     const hits=bw.map(w=>[w,String(v.full||'').split(w).length-1]).filter(x=>x[1]>0);
     return '<details class="cand"'+(i===0?' open':'')+'><summary><b>'+esc(v.label||'版本')+'</b> <span class="small muted">'+esc(fdate(v.createdAt))+(v.demo?'・示範':'')+'</span></summary>'
      +(hits.length?'<div class="candwarn">⚠ 含有你標示要避免的詞：'+esc(hits.map(x=>x[0]+(x[1]>1?'×'+x[1]:'')).join('、'))+'</div>':'')
      +'<div class="candtxt">'+esc(v.full||composeFull(v))+'</div>'
      +'<div class="acts"><button class="btn gold sm" data-act="useCand" data-id="'+esc(v.id)+'">使用這版</button><button class="btn sm" data-act="copyCand" data-id="'+esc(v.id)+'">複製</button><button class="btn sm danger" data-act="delCand" data-id="'+esc(v.id)+'">刪除</button></div></details>';
   }).join('')+'</div>';
}
function scriptPrompt(c,tp,s,acq){
  let p=scriptPromptBase(c,tp,s,acq);
  const rl=String((c.brand&&c.brand.rules)||'').trim(),cl=String((c.brand&&c.brand.ctaLog)||'').trim();
  if(rl){p=p.replace('每個 45–60 秒（約 250～330 字）','長度依「固定規則」').replace('hook（15 字內，','hook（字數與寫法依「固定規則」，');}
  const ins=(rl?'\n\n【固定規則（最高優先；與下方「寫作要求」的結構、秒數、字數衝突時，一律以此為準，寫完逐條檢查）】\n'+rl:'')+(cl?'\n\n【已用過的 CTA 紀錄（新寫的 CTA 關鍵字不可與這些重複）】\n'+cl:'');
  return ins?p.replace('\n\n寫作要求（逐條遵守）',ins+'\n\n寫作要求（逐條遵守）'):p;
}
function scriptPromptBase(c,tp,s,acq){
  const sts=real(c,'stories');
  const ord=sts.filter(x=>x.title===tp.story).concat(sts.filter(x=>x.title!==tp.story)).slice(0,4);
  const stTxt=ord.length?ord.map(x=>'《'+x.title+'》'+short(x.content||x.background||'',600)+(x.twist?'｜轉折：'+short(x.twist,200):'')).join('\n\n'):'（目前沒有可用的真實故事）';
  const ctl=real(c,'ctas').slice(0,8).map(x=>'- '+x.text+(x.keyword?'｜關鍵字：'+x.keyword:'')+(x.action?'｜動作：'+x.action:'')).join('\n')||'（目前沒有）';
  const fnl=real(c,'funnels').slice(0,6).map(x=>'- 入口：'+x.entry+(x.keyword?'｜關鍵字：'+x.keyword:'')+(x.dm?'｜留言後的私訊內容：'+x.dm:'')+(x.next?'｜下一步：'+x.next:'')+(x.service?'｜對應服務：'+svcShort(x.service):'')).join('\n')||'（目前沒有）';
  return '請為以下選題寫兩個「切入角度明顯不同」的短影音口播版本，每個 45–60 秒（約 250～330 字），可以直接對鏡頭說。\n選題：'+(tp.title||s.title)+'\n類型：'+(tp.type||'')+'\n目標：'+(tp.goal||s.goal||'')+'\n核心訊息（只供你理解）：'+(tp.message||'')+'\n寫作方向（只供你理解，不可寫進口播）：'+(tp.angle||'')+'\n\n【可用的真實故事（完整內容，只能使用這裡的事實）】\n'+stTxt+'\n\n【可用的 CTA】\n'+ctl+'\n\n【內容漏斗（留言關鍵字之後的流程）】\n'+fnl
   +'\n\n寫作要求（逐條遵守）：\n1. 整支只談選題這一件事，開頭、中段、結尾都要扣住它，不可跑題，也不要把個人履歷從頭講一遍。\n2. 結構：hook（15 字內，直接說出觀眾最在意的事，或一個反直覺的判斷；不要用「你有沒有發現」「你是不是也」「你知道嗎」這類套句開頭）→ problem（一個具體畫面或場景，有動作、有一句話或細節）→ story（若有用到故事，只講與選題直接相關的一小段）→ body（關鍵判斷：指出觀眾原本沒看見的地方）→ twist（一句讓人停下來想的話）→ solution（觀眾今天就能用的東西：一個判斷標準、一個自我檢查問題，或一個小動作，必須具體）→ ending（自然收尾，不要雞湯）→ cta。\n3. 看完必須「帶得走一個具體的東西」，不能只有共鳴、安慰或抽象說法；不要用「看見自己」「重新整理」「找到方向」這類沒有說明做法的空話。\n4. 故事只能使用上面真實故事裡的事實；故事與選題無關就不要硬用，改描述「很多人常見的場景」，且不要寫成某位真實客戶的案例。不得編造經歷、客戶、數字或成果。\n5. CTA：'+(acq?'必須和這支影片的主題直接相關，並清楚說出「留言或私訊之後會得到什麼、會發生什麼事」。只能使用上方 CTA 與內容漏斗裡實際存在的關鍵字與流程，挑最貼近這支主題的一個；如果沒有任何一個貼題，cta 寫「【請補充：適合這支影片的 CTA 關鍵字，以及留言後對方會得到什麼】」，不要硬套不相關的 CTA，也不要自創免費資源、贈品、名額或價格。不要用「想聊聊你的近況」「留言跟我說說」這種沒有明確目的的邀請。':'這支不是銷售影片，不要放服務或價格；cta 用一個具體的互動邀請（例如請觀眾留言回答一個和內容相關的選擇題），不要只是「留言告訴我」。')+'\n6. 品牌資料裡標示「不要／避免」的詞語與寫法一律不可出現，寫完逐條檢查；語氣依「說話語氣」，像對一個人說話，不要像文章或報告。\n7. 兩個版本的切入點要真的不同：版本 A 從故事或畫面切入；版本 B 從一個直接的判斷或反直覺的觀點切入，不是只換幾個字。\n\n輸出 JSON 物件：{"versions":[{"label":"版本 A：（8 字內說明切入點）","hook":"","problem":"","story":"","twist":"","body":"","solution":"","ending":"","cta":"","full":""},{"label":"版本 B：…", …}]}。full 是把各段串成通順、可直接念的口播，不得出現欄位名稱或提示語，不得重複段落；其餘欄位是 full 對應的片段。沒有資料的地方寫【請補充：…】，不要編造。';
}
const findScript=(cid,sid)=>{const c=DB.clients.find(x=>x.id===cid);return c?c.scripts.find(x=>x.id===sid):null};
ACT.genScript=async t=>{
  const c=cur(),s=curScript();if(!s)return;readScript(s);persist();
  const cid=c.id,sid=s.id;
  const tp=c.topics.find(x=>x.id===s.topicId)||{title:s.title,goal:s.goal};
  setBusy(t,true,'產生中…（可能要 30～60 秒，請先不要關閉網頁）');
  const acq=/獲客|獲取客戶/.test((tp.type||'')+(tp.goal||s.goal||''));
  const r=await aiJSON(c,scriptPrompt(c,tp,s,acq),()=>demoScript(c,tp));
  setBusy(t,false);
  let arr=Array.isArray(r.data)?r.data:(r.data&&Array.isArray(r.data.versions)?r.data.versions:(r.data?[r.data]:[]));
  arr=arr.filter(x=>x&&typeof x==='object').slice(0,3);
  const rec=findScript(cid,sid);
  if(!rec){toast('這支文案已經不存在，結果沒有存入');return}
  const shown=!!document.getElementById('scr_'+sid);
  if(shown)readScript(rec);
  const vs=arr.map((x,i)=>{const o={id:uid(),label:String(x.label||'版本 '+'ABC'[i]),createdAt:iso(),demo:!!r.demo};SECTIONS.forEach(k=>{o[k]=String(x[k]==null?'':x[k]).trim()});o.full=cleanSpoken(x.full||composeFull(o));return o});
  if(!vs.length){toast('沒有取得文案，請再試一次');return}
  if(!r.demo&&vs.some(v=>LABEL_LEAK.test(v.full)))toast('文案中出現欄位名稱，請檢查後再使用',4200);
  rec.candidates=vs.concat(rec.candidates||[]).slice(0,6);rec.updatedAt=iso();persist();
  if(shown){render(true);const e=$('#cands');if(e)e.scrollIntoView({block:'start'});toast(r.demo?'已產生示範版本（尚未設定 AI API），往下看「AI 產生的版本」':'已產生 '+vs.length+' 個版本，往下看「AI 產生的版本」',3600)}
  else toast('文案已產生，存在「'+short(rec.title,14)+'」的版本清單，回到那支文案就看得到',4200);
};
ACT.useCand=async t=>{
  const s=curScript();if(!s)return;readScript(s);
  const v=(s.candidates||[]).find(x=>x.id===t.dataset.id);if(!v)return;
  const had=CAND_KEYS.some(k=>String(s[k]||'').trim());
  if(had&&!await confirmDialog('上面的欄位已經有內容，套用這版會取代它。\n取代前的內容會先存成一個版本，不會消失。要套用嗎？','套用'))return;
  if(had){const snap={id:uid(),label:'套用前的內容',createdAt:iso(),demo:false};CAND_KEYS.forEach(k=>{snap[k]=s[k]||''});if(String(snap.full||composeFull(snap)).trim())s.candidates.unshift(snap)}
  CAND_KEYS.forEach(k=>{s[k]=v[k]||''});s.candidates=s.candidates.slice(0,8);s.updatedAt=iso();persist();render(true);toast('已套用這版並保存');
};
ACT.copyCand=t=>{const s=curScript();const v=s&&(s.candidates||[]).find(x=>x.id===t.dataset.id);if(v)copyText(v.full||composeFull(v))};
ACT.delCand=async t=>{
  const s=curScript();if(!s)return;
  if(!await confirmDialog('確定刪除這個 AI 版本？','刪除'))return;
  readScript(s);s.candidates=(s.candidates||[]).filter(x=>x.id!==t.dataset.id);persist();render(true);toast('已刪除');
};
ACT.genShoot=async t=>{
  const c=cur(),s=curScript();if(!s)return;readScript(s);persist();
  const cid=c.id,sid=s.id;
  const txt=s.full||composeFull(s);

/* 雲端同步動作 */
ACT.saveSync=async t=>{
  let url=$('#sync_url').value.trim(),tk=$('#sync_token').value.trim();
  if(!tk)tk=SYNC.token;
  if(!url||!tk){info('請填寫完整','需要同時填寫後端網址與同步密碼。');return}
  try{const u=new URL(url);if(u.protocol!=='https:'&&!/^(localhost|127\.0\.0\.1)$/.test(u.hostname))throw 0;url=u.origin}
  catch(e){info('後端網址格式不正確','請填寫完整網址，例如 https://brand-studio-sync.你的帳號.workers.dev（要有 https://）。');return}
  if(/[^\x21-\x7E]/.test(tk)){info('同步密碼含有不正常的字元','同步密碼只能是英文、數字與符號。可能貼上了空白、換行或全形字，請清除後重新貼上。');return}
  const old={url:SYNC.url,token:SYNC.token,auto:SYNC.auto};
  const restore=()=>{SYNC.url=old.url;SYNC.token=old.token;SYNC.auto=old.auto};
  SYNC.url=url;SYNC.token=tk;SYNC.auto=$('#sync_auto').value==='1';
  setBusy(t,true,'連線中…');
  const hl=await cloudFetch('/api/health',{noAuth:true,timeout:15000});
  if(!hl.ok||!hl.json||!hl.json.ok){
    let extra='';
    if(hl.net){const reach=await probeReach(url+'/');extra=reach?'\n\n診斷：這個頁面連得到 '+url+'，但瀏覽器不讓程式讀取回應。最常見的原因是後端的 ALLOWED_ORIGINS 沒有填你的網頁網址（要填 https://帳號.github.io，不含路徑）。':'\n\n診斷：連不到 '+url+'。請檢查網址有沒有打錯、網路是否正常；如果是在聊天室或檔案預覽視窗裡打開這個 HTML，外部連線常被擋，請改用 Safari／Chrome 直接開啟。'}
    setBusy(t,false);restore();
    info('連線失敗',(hl.net?'無法連到後端。':cloudErr(hl))+extra);return;
  }
  const au=await cloudFetch('/api/history');
  if(!au.ok){setBusy(t,false);restore();info('連線失敗',cloudErr(au));return}
  saveSync();
  const res=await linkSync();
  setBusy(t,false);
  syncStart();
  render(true);
  if(res.pendingChoice&&SYNC.cloud)showConflict();
  const ai=hl.json.ai||{};
  const aiMsg=ai.key&&ai.model?'AI：後端已設定 Key 與模型，AI 功能會走後端。':'AI：後端還沒設定完整（缺 '+[ai.key?'':'AI 金鑰',ai.model?'':'模型名稱'].filter(Boolean).join('、')+'）。資料同步可以用，AI 暫時仍是示範結果。';
  if(!res.pendingChoice)info(res.ok?'已連線':'已連線，但同步有問題',res.msg+'\n\n'+aiMsg);
};
ACT.syncNow=async t=>{
  if(SYNC.state==='conflict'&&SYNC.cloud){showConflict();return}
  setBusy(t,true,'同步中…');
  await pullNow();
  if(SYNC.pending&&SYNC.state!=='conflict'){const p=SYNC.pending;SYNC.pending=null;applyCloud(p.data,p.rev,false)}
  if(SYNC.dirty&&SYNC.state!=='conflict')await pushNow();
  setBusy(t,false);
  if(SYNC.state==='conflict')return;
  toast(SYNC.state==='ok'&&!SYNC.dirty?'已同步':(SYNC.err||'同步沒有完成，稍後會再試'));
};

  catch(e){copyText(JSON.stringify(obj,null,2));toast('無法下載，已改為複製 JSON')}
};

/* ============ 事件綁定 ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const fn=ACT[t.dataset.act];if(!fn){console.warn('未定義的動作：'+t.dataset.act);return}
  if(t.tagName!=='A')e.preventDefault();
  fn(t,e);
});
function onFilter(e){
  const t=e.target;if(!t.dataset||!t.dataset.filter)return;
  const vk=t.dataset.vk,f=UI.f[vk];if(!f)return;
  f[t.dataset.filter]=t.value;
  const box=$('#res-'+vk);if(box)box.innerHTML=resultsHTML(vk);
}
document.addEventListener('input',onFilter);
document.addEventListener('change',e=>{
  onFilter(e);
  const t=e.target;
  if(t&&t.id==='impfile'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{previewImport(String(fr.result||''));t.value=''};fr.onerror=()=>info('讀取失敗','無法讀取這個檔案。');fr.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').classList.contains('open'))closeModal()});

render();
syncStart();
})();
</script>
</body>
</html>
